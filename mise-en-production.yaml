apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-detection
spec:
  project: default
  source:
    repoURL: https://github.com/remi-guy/mise-en-production-deployment.git
    targetRevision: main
    path: deployment
  destination:
    server: https://kubernetes.default.svc
    namespace: user-remiguy
  syncPolicy:
    automated:
      selfHeal: true
      prune: true